<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطوير أعمالي | Business Development</title>
<meta name="description" content="نظام إدارة تطوير الأعمال والمشاريع المستدامة">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f766e'/><path d='M26 66 L44 44 L58 58 L76 32' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<!-- ✅ CSS (flat structure, filename is style.css) -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ================= TOPBAR ================= -->
  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <a class="brand" href="#/dashboard">
      <span class="brand-mark">
        <svg viewBox="0 0 100 100"><path d="M26 66 L44 44 L58 58 L76 32" stroke="currentColor" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">
        <strong data-i18n="app_name">تطوير أعمالي</strong>
        <small data-i18n="tagline">إدارة المشاريع المستدامة</small>
      </span>
    </a>

    <div class="topbar-spacer"></div>

    <div class="sync-chip" id="syncChip" title="">
      <span class="dot" id="syncDot"></span>
      <span id="syncLabel" data-i18n="msg_local_mode">محلي</span>
    </div>

    <button class="icon-btn" id="langBtn" title="Language">
      <span id="langLabel">EN</span>
    </button>

    <button class="icon-btn" id="themeBtn" title="Theme">
      <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="layout">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav" id="mainNav">
        <a class="nav-item" href="#/dashboard" data-route="dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/></svg>
          <span data-i18n="nav_dashboard">لوحة التحكم</span>
        </a>
        <a class="nav-item" href="#/ideas" data-route="ideas">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
          <span data-i18n="nav_ideas">الأفكار</span>
          <em class="badge" id="badgeIdeas"></em>
        </a>
        <a class="nav-item" href="#/projects" data-route="projects">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span data-i18n="nav_projects">المشاريع</span>
          <em class="badge" id="badgeProjects"></em>
        </a>
        <a class="nav-item" href="#/tasks" data-route="tasks">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span data-i18n="nav_tasks">المهام</span>
          <em class="badge" id="badgeTasks"></em>
        </a>
        <a class="nav-item" href="#/strategy" data-route="strategy">
          <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3"/></svg>
          <span data-i18n="nav_strategy">الاستراتيجية</span>
        </a>
        <a class="nav-item" href="#/impact" data-route="impact">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a7 7 0 0 1 14 0c0 5.5-7 10-7 10z"/><circle cx="12" cy="11" r="2.5"/></svg>
          <span data-i18n="nav_impact">الأثر والاستدامة</span>
        </a>
        <a class="nav-item" href="#/sales" data-route="sales">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
          <span data-i18n="nav_sales">المبيعات</span>
          <em class="badge" id="badgeDeals"></em>
        </a>
        <a class="nav-item" href="#/reports" data-route="reports">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span data-i18n="nav_reports">التقارير</span>
        </a>
      </nav>

      <div class="nav-sep"></div>

      <a class="nav-item" href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 14.2H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 3V3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15.8 4.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        <span data-i18n="nav_settings">الإعدادات</span>
      </a>
    </aside>

    <div class="scrim" id="scrim"></div>

    <!-- ================= MAIN ================= -->
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" role="status" aria-live="polite"></div>

<!-- ================= MODAL TEMPLATE ================= -->
<template id="tpl-modal">
  <div class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <header class="modal-head">
        <h3 class="modal-title"></h3>
        <button class="icon-btn" data-close aria-label="close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="modal-body"></div>
      <footer class="modal-foot"></footer>
    </div>
  </div>
</template>

<!-- ================= SCRIPTS (LOAD ORDER MATTERS) ================= -->
<!-- 1. External: Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- 2. Internal modules — order is required for dependencies -->
<script src="i18n.js"></script>       <!-- Provides: window.I18n   -->
<script src="store.js"></script>      <!-- Uses I18n, provides: window.Store -->
<script src="ui.js"></script>         <!-- Uses I18n, provides: window.UI -->
<script src="views.js"></script>      <!-- Uses I18n, Store, UI, provides: window.Views -->
<script src="app.js"></script>        <!-- Uses all, boots the app -->

</body>
</html>
